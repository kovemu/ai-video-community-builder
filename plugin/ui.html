<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Video Community Builder</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17191c;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;padding:16px}h1{font-size:16px;line-height:1.35;margin:0 0 16px}h2{font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;color:#6b7280}.stack{display:grid;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{appearance:none;width:100%;border:1px solid #d1d5db;background:#fff;color:#17191c;border-radius:10px;padding:10px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}button:hover{border-color:#9ca3af;background:#fdfdfd}button.primary{background:#356df3;color:#fff;border-color:#356df3}button.primary:hover{background:#285bd7;border-color:#285bd7}label{display:flex;gap:8px;align-items:center;font-size:12px;margin:8px 0;color:#454b55}input{accent-color:#356df3}#status{margin-top:16px;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#6b7280;font-size:12px;min-height:38px;line-height:1.45}
  </style>
</head>
<body>
  <h1>AI Video Community Builder</h1>
  <div class="stack">
    <button data-action="sync-github">GitHub 최신 버전 불러오기</button>
    <button class="primary" data-action="build-all">최신 버전으로 전체 화면 다시 생성</button>
  </div>
  <h2>개별 생성</h2>
  <div class="grid">
    <button data-action="build-home">Home</button><button data-action="build-discover">Discover</button>
    <button data-action="build-collaboration">Collaboration</button><button data-action="build-marketplace">Marketplace</button>
    <button data-action="build-profile">Creator Profile</button>
  </div>
  <h2>옵션</h2>
  <label><input id="deleteExisting" type="checkbox" checked /> 기존 Builder 화면 삭제 후 생성</label>
  <label><input id="arrange" type="checkbox" checked /> 화면들을 가로로 정렬</label>
  <div id="status">상태: 준비됨</div>
  <script>
    const statusEl=document.getElementById('status');
    const getOptions=()=>({deleteExisting:document.getElementById('deleteExisting').checked,arrange:document.getElementById('arrange').checked});
    document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{statusEl.textContent='상태: 처리 중…';statusEl.style.color='#6b7280';parent.postMessage({pluginMessage:{type:button.dataset.action,options:getOptions()}},'*')}));
    onmessage=event=>{const message=event.data?.pluginMessage;if(!message||message.type!=='status')return;statusEl.textContent=`상태: ${message.message}`;statusEl.style.color=message.ok?'#16a36a':'#dc4c4c'};
  </script>
</body>
</html>
